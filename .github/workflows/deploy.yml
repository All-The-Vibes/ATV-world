name: Deploy

# Every push to main goes live, and problems in a push don't fail the run:
# scripts/build.ts leaves out plots that don't build and keeps the live version of other files that break it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: https://calm-sea-064d9241e.3.azurestaticapps.net

jobs:
  deploy:
    # Forks don't have the deploy token.
    if: github.repository == 'All-The-Vibes/ATV-world'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE }}
    steps:
      # Full history: plots claim lots in the order they first landed on main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        id: node
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: npm
      # A push can break .nvmrc or the lockfile: fall back to a known-good Node.
      - if: steps.node.outcome == 'failure'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The commit that's live now. Files that break the build fall back to it.
      - name: Find the live version
        id: live
        run: |
          sha=$(curl -fsS --max-time 10 "$SITE/version.json" | jq -r '.sha // empty' 2>/dev/null || true)
          if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Live: $sha"
          else
            echo "Live version unknown, so only plots can fall back this run."
          fi

      - name: Install
        id: install
        continue-on-error: true
        env:
          LIVE: ${{ steps.live.outputs.sha }}
        run: |
          npm ci || npm install && exit 0
          [ -n "$LIVE" ] || exit 1
          echo "::warning title=npm install failed::Using the live package.json and package-lock.json."
          git checkout "$LIVE" -- package.json package-lock.json
          npm ci

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          ATV_LIVE_SHA: ${{ steps.live.outputs.sha }}
        run: |
          node scripts/build.ts && exit 0
          # The build script itself is broken: retry with the live one.
          [ -n "$ATV_LIVE_SHA" ] && git cat-file -e "$ATV_LIVE_SHA:scripts/build.ts" 2>/dev/null || exit 1
          echo "::warning title=scripts/build.ts crashed::Retrying with the live version of scripts/."
          git checkout "$ATV_LIVE_SHA" -- scripts
          node scripts/build.ts

      # Pushes often land seconds apart. Only the newest deploys, and it includes everything before it.
      - name: Check for a newer push
        id: fresh
        if: steps.build.outputs.deploy == 'true'
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on to ${tip:0:7}, which deploys instead (with this push included)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.fresh.outputs.ok == 'true'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      # Azure turns an upload away while another deploy is uploading, so a failed upload waits and tries again.
      # Retries are skipped once a newer push lands, since that one deploys with this push included.
      - name: Wait to retry
        id: wait1
        if: steps.deploy.outcome == 'failure'
        run: |
          sleep 20
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::Upload failed, but main has moved on to ${tip:0:7}, which deploys instead."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (second try)
        id: deploy2
        if: steps.wait1.outputs.ok == 'true'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      - name: Wait to retry again
        id: wait2
        if: steps.deploy2.outcome == 'failure'
        run: |
          sleep 60
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::Upload failed, but main has moved on to ${tip:0:7}, which deploys instead."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (third try)
        id: deploy3
        if: steps.wait2.outputs.ok == 'true'
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      # Warnings, not failures: the pusher can't fix either case, and the next push deploys everything.
      - name: Report
        if: steps.build.outputs.deploy != 'true' || steps.deploy3.outcome == 'failure'
        env:
          BUILT: ${{ steps.build.outputs.deploy }}
        run: |
          if [ "$BUILT" != true ]; then
            echo "::warning title=Nothing deployed::This push didn't build, so the live world is unchanged. See the Install and Build logs."
          else
            echo "::warning title=Upload failed::Azure turned the upload away three times. The Auto-merge workflow redeploys within a few minutes, and so does the next push."
          fi

  # Type errors show up as warnings on the run. They never block a deploy.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        continue-on-error: true
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.node.outcome == 'failure'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        id: install
        continue-on-error: true
        run: npm ci || npm install
      - name: Typecheck
        if: steps.install.outcome == 'success'
        run: |
          npx --no-install tsc --noEmit -p . --pretty false > tsc.log 2>&1 && exit 0
          sed -E 's/: error (TS[0-9]+)/: warning \1/' tsc.log
          echo "::notice::Type errors are warnings here. They never block a deploy."
