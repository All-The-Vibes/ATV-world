name: Pylint

on:
  push:
    # Only when Python changes. The world itself is TypeScript.
    paths: ['**.py']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    # Findings are informational: lint never fails a push.
    - name: Analysing the code with pylint
      run: git ls-files -z '*.py' | xargs -0 -r pylint --exit-zero
